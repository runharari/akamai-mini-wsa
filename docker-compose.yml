# The whole stack: Kafka, ClickHouse, and the app run as 5 containers from one image,
# one Spring profile (role) each. `docker compose up --build`, then POST to :8080, query :8081,
# alerts on :8082.

x-app: &app
  build: .
  image: mini-wsa:latest
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/default
    CLICKHOUSE_USER: wsa
    CLICKHOUSE_PASSWORD: wsa
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  mem_limit: 512m
  depends_on:
    kafka: { condition: service_healthy }
    clickhouse: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "curl -fs localhost:8080/actuator/health >/dev/null || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 30

services:

  ingest:
    <<: *app
    environment: { <<: *app-env, SPRING_PROFILES_ACTIVE: ingest }
    ports:
      - "8080:8080"   # POST /v1/events/ingest

  processor:
    <<: *app
    environment: { <<: *app-env, SPRING_PROFILES_ACTIVE: processor }

  sink:
    <<: *app
    environment: { <<: *app-env, SPRING_PROFILES_ACTIVE: sink }

  query:
    <<: *app
    environment: { <<: *app-env, SPRING_PROFILES_ACTIVE: query }
    ports:
      - "8081:8080"   # GET /v1/stats/..., /v1/events/samples

  alerting:
    <<: *app
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: alerting
      SPRING_KAFKA_STREAMS_APPLICATION_ID: mini-wsa-alerting   # its own Kafka Streams app, apart from the processor
    ports:
      - "8082:8080"   # POST /v1/alerts/define, GET /v1/alerts/evaluate

  kafka:
    image: apache/kafka:4.2.2
    ports:
      - "29092:29092"   # for the app / tools running on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created by the app, typos fail loudly
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    ports:
      - "8123:8123"   # HTTP interface (JDBC + curl)
    environment:
      CLICKHOUSE_USER: wsa
      CLICKHOUSE_PASSWORD: wsa
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
